<!DOCTYPE html>
<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">


<title>PA#1</title>
<style>
    body {
        background-color: #EEEEEE;
    }
</style>

<script src="./Utils/trackball-rotator.js"></script>
<script src="./Utils/m4.js"></script>
<script src="./shader.gpu"></script>
<script src="./Model.js"></script>
<script src="./StereoCamera.js"></script>
<script src="./Texture.js"></script>
<script src="./main.js"></script>
<script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
<script src="https://cdn.rawgit.com/jeromeetienne/AR.js/2.2.1/aframe/build/aframe-ar.js"></script>
  

</head>
<body onload="init()">


 <a-scene embedded arjs>
      <!-- Use your custom pattern file here -->
      <a-marker type="pattern" url="AR_Photo.patt">
        <!-- Example: 3D box. Replace with your own model or <a-image> for a picture -->
        <a-image src= "test.jpg" width="5" height="5" position="0 0.5 0"></a-image>
        <!-- Example: To use a 3D model (GLTF/GLB), use:
        <a-entity gltf-model="url(yourmodel.glb)" scale="0.5 0.5 0.5"></a-entity>
        -->
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>


<h2>A Cube with "Trackball" Mouse Rotation</h2>

<p id="message">Drag your mouse on the cube to rotate it.<br>
(On a touch screen, you can use your finger.)</p>

<div style="margin-bottom:10px;">
  <label>Eye Separation: <input id="eyeSeparation" type="range" min="0.1" max="2.0" step="0.01" value="0.7"></label>
  <label>FOV (rad): <input id="fov" type="range" min="0.1" max="1.5" step="0.01" value="0.4"></label>
  <label>Near: <input id="near" type="range" min="1.0" max="20.0" step="0.1" value="8.0"></label>
  <label>Convergence: <input id="convergence" type="range" min="5.0" max="30.0" step="0.1" value="14.0"></label>
</div>


<div id="canvas-holder">
   <canvas width="600" height="600" id="webglcanvas" style="background-color:red"></canvas>
</div>


</body></html>
