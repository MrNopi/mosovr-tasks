<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AR.js Custom Pattern Example</title>
  <style>
    body { margin: 0; overflow: hidden; background: #eee; }
  </style>
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.rawgit.com/jeromeetienne/AR.js/2.2.1/aframe/build/aframe-ar.js"></script>
</head>
<body>
  <a-scene embedded arjs>
    <!-- Використовуйте ваш патерн -->
    <a-marker type="pattern" url="pattern_photo.patt">
      <!-- Замість HIRO.jpg вставте своє зображення або 3D-модель -->
      <a-image src="test.jpg" width="2" height="2" position="0 1 0"></a-image>
      <!--
      <a-entity gltf-model="url(yourmodel.glb)" scale="0.5 0.5 0.5"></a-entity>
      -->
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
