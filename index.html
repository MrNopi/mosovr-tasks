<!DOCTYPE html>
<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">


<title>PA#2</title>
<style>
    body {
        background-color: #EEEEEE;
    }
</style>

<script src="./Utils/trackball-rotator.js"></script>
<script src="./Utils/m4.js"></script>
<script src="./shader.gpu"></script>
<script src="./Model.js"></script>
<script src="./StereoCamera.js"></script>
<script src="./Texture.js"></script>
<script src="./main.js"></script>

</head>
<body onload="init()">

<h2>A Cube with "Trackball" Mouse Rotation</h2>

<p id="message">Drag your mouse on the cube to rotate it.<br>
(On a touch screen, you can use your finger.)</p>

<div style="margin-bottom:10px;">
  <label>Eye Separation: 
    <input id="eyeSeparation" type="range" min="0.1" max="2.0" step="0.01" value="0.7" 
           oninput="updateEyeSepValue(this.value)">
    <span id="eyeSepValue"></span>
  </label>
  <label>FOV (rad): 
    <input id="fov" type="range" min="0.1" max="1.5" step="0.01" value="0.4" 
           oninput="updateFovValue(this.value)">
    <span id="fovValue"></span>
  </label>
  <label>Near: 
    <input id="near" type="range" min="1.0" max="20.0" step="0.1" value="8.0" 
           oninput="updateNearValue(this.value)">
    <span id="nearValue"></span>
  </label>
  <label>Convergence: 
    <input id="convergence" type="range" min="5.0" max="30.0" step="0.1" value="14.0" 
           oninput="updateConvValue(this.value)">
    <span id="convValue"></span>
  </label>
</div>


<div id="canvas-holder">
   <canvas width="600" height="600" id="webglcanvas" style="background-color:red"></canvas>
</div>


</body></html>
